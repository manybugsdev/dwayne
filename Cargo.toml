[package]
name = "dwayne"
version = "0.1.0"
edition = "2024"
description = "Repeatedly ask an AI to replicate an image, feeding each result back in as the next input, to watch it drift."

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
indicatif = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
